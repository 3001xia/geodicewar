function drawRealFlagLayer(){

 document.querySelectorAll("clipPath[data-empireflag='1']").forEach(n=>n.remove());

 $("countries").parentNode.insertBefore(layer,$("countries"));
 for(const o of live()){
  let ts=terr(o),els=ts.map(t=>$("c_"+t)).filter(Boolean),boxes=els.map(e=>e.getBBox());if(!boxes.length)continue;
  let x=Math.min(...boxes.map(b=>b.x)),y=Math.min(...boxes.map(b=>b.y)),x2=Math.max(...boxes.map(b=>b.x+b.width)),y2=Math.max(...boxes.map(b=>b.y+b.height));
  let cid="ef_"+String(o).replace(/[^A-Za-z0-9_]/g,"_"),cp=document.createElementNS("http://www.w3.org/2000/svg","clipPath");cp.id=cid;cp.setAttribute("data-empireflag","1");
  ts.forEach(t=>{let u=document.createElementNS("http://www.w3.org/2000/svg","use");u.setAttribute("href","#c_"+t);cp.appendChild(u)});defs.appendChild(cp);
  let im=document.createElementNS("http://www.w3.org/2000/svg","image"),a2=(M[o]?.a2||"").toLowerCase();
  im.setAttribute("href",EMBEDDED_FLAGS[a2]||rebelFlag(o));im.setAttribute("x",x);im.setAttribute("y",y);im.setAttribute("width",Math.max(1,x2-x));im.setAttribute("height",Math.max(1,y2-y));

 }else $("info").textContent="點地圖查看國家資訊。"

 if(n>=2||Math.random()>.65)return;

function ownerColor(x){let h=0;for(let c of String(x))h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 58% 72%)`}

function drawEmpireFlags(){
 const layer=$("flagLayer"); if(!layer)return; layer.innerHTML="";
 // remove old dynamic clips
 document.querySelectorAll("clipPath.empireClip").forEach(x=>x.remove());
 let defs=document.querySelector("defs");
 for(const o of live()){
   let ts=terr(o), boxes=ts.map(id=>$("c_"+id).getBBox());
   let x=Math.min(...boxes.map(b=>b.x)),y=Math.min(...boxes.map(b=>b.y)),x2=Math.max(...boxes.map(b=>b.x+b.width)),y2=Math.max(...boxes.map(b=>b.y+b.height));
   let cp=document.createElementNS("http://www.w3.org/2000/svg","clipPath");cp.id="clip_"+o;cp.classList.add("empireClip");
   for(const id of ts){let use=document.createElementNS("http://www.w3.org/2000/svg","use");use.setAttribute("href","#c_"+id);cp.appendChild(use)}defs.appendChild(cp);
   let im=document.createElementNS("http://www.w3.org/2000/svg","image");
   let a2=M[o]?.a2||""; let href=a2?`https://flagcdn.com/w640/${a2}.png`:rebelFlag(o);
   im.setAttribute("href",href);im.setAttribute("x",x);im.setAttribute("y",y);im.setAttribute("width",Math.max(1,x2-x));im.setAttribute("height",Math.max(1,y2-y));
   im.setAttribute("preserveAspectRatio","xMidYMid slice");im.setAttribute("clip-path",`url(#clip_${o})`);im.style.pointerEvents="none";
   let triedBackup=false;
   im.addEventListener("error",()=>{
     if(a2&&!triedBackup){triedBackup=true;im.setAttribute("href",`https://flagcdn.com/h240/${a2}.png`);return}
     im.remove();
     let tx=document.createElementNS("http://www.w3.org/2000/svg","text");
     tx.textContent=flagEmoji(o);tx.setAttribute("x",(x+x2)/2);tx.setAttribute("y",(y+y2)/2);
     tx.setAttribute("text-anchor","middle");tx.setAttribute("dominant-baseline","middle");
     tx.setAttribute("font-size",Math.max(13,Math.min(42,(x2-x)*.24,(y2-y)*.5)));
     tx.style.pointerEvents="none";layer.appendChild(tx);
   });
   layer.appendChild(im);
 }
 // paths themselves stay transparent over the image, preserving borders and taps
 document.querySelectorAll(".country").forEach(e=>{let o=O.get(e.dataset.id);e.style.fill=ownerColor(o);e.style.pointerEvents="all"});
}

   let o=O.get(e.dataset.id);
   e.style.fill=ownerColor(o);
   e.style.backgroundColor=ownerColor(o);
 });
}

let rebelNo=0, zoom={x:0,y:0,k:1};
const rebelPrefixes=["新","自由","聯合","人民","共和","北方","南方","中央","獨立","新生"];
const rebelSuffixes=["共和國","聯邦","國","自由邦","聯盟","公國"];
function rebelName(parent){return rebelPrefixes[Math.floor(Math.random()*rebelPrefixes.length)]+M[parent].name+rebelSuffixes[Math.floor(Math.random()*rebelSuffixes.length)]}
function rebelFlag(id){let cs=["7c3aed","dc2626","0891b2","16a34a","ea580c","1d4ed8"],h=[...id].reduce((a,c)=>a+c.charCodeAt(0),0),a=cs[h%cs.length],b=cs[(h+2)%cs.length];return "data:image/svg+xml,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3 2"><rect width="3" height="2" fill="#${a}"/><path d="M0 2L3 0V2Z" fill="#${b}"/><circle cx="1.5" cy="1" r=".32" fill="white"/></svg>`)}
function maybeRebel(){
 let c=live().filter(x=>sz(x)>=20); if(!c.length||Math.random()>.12)return;
 let p=pick(c), pool=terr(p), parentSize=pool.length;
 let maxWant=Math.floor(parentSize/2), minWant=Math.min(10,maxWant);
 let want=minWant+Math.floor(Math.random()*(maxWant-minWant+1));
 let seed=pick(pool), chosen=[seed], chosenSet=new Set([seed]);
 // Grow a connected rebel state by repeatedly adding any parent territory
 // adjacent to the already-selected rebel territory.
 while(chosen.length<want){
   let candidates=[];
   for(const q of chosen){
     for(const n of (N[q]||[])){
       if(O.get(n)===p&&!chosenSet.has(n)&&!candidates.includes(n))candidates.push(n);
     }
   }
   if(!candidates.length)break;
   let n=pick(candidates);chosen.push(n);chosenSet.add(n);
 }
 let id="REB_"+(++rebelNo),nm=rebelName(p);let rp=REAL_REBEL_POOL[p]||[];let rl=rp.length?pick(rp):ensureLeader(p);M[id]={name:nm,a2:"",leader:rl};chosen.forEach(t=>O.set(t,id));
 let defs=document.querySelector("defs"),pat=document.createElementNS("http://www.w3.org/2000/svg","pattern");
 pat.id="f_"+id;pat.setAttribute("patternUnits","objectBoundingBox");pat.setAttribute("width","1");pat.setAttribute("height","1");
 let im=document.createElementNS("http://www.w3.org/2000/svg","image");
 im.setAttribute("href",rebelFlag(id));im.setAttribute("width","1");im.setAttribute("height","1");im.setAttribute("preserveAspectRatio","xMidYMid slice");
 pat.appendChild(im);defs.appendChild(pat);
 showNews(`${nm}宣布獨立！${M[p].name}爆發大規模分裂`,
   `新政權領導者 ${M[id].leader} 宣布建國，一次控制 ${chosen.length} 個相連區域；叛亂發生前母國共有 ${parentSize} 個區域。`);
 render()
}
function empirePatterns(){
 // One shared flag coordinate system per empire: all its territories reveal pieces of the SAME single flag.
 for(const o of live()){
   let ts=terr(o), boxes=ts.map(id=>$("c_"+id).getBBox()), x=Math.min(...boxes.map(b=>b.x)),y=Math.min(...boxes.map(b=>b.y)),x2=Math.max(...boxes.map(b=>b.x+b.width)),y2=Math.max(...boxes.map(b=>b.y+b.height));
   let pat=$("f_"+o); if(!pat)continue;
   pat.setAttribute("patternUnits","userSpaceOnUse");pat.setAttribute("x",x);pat.setAttribute("y",y);pat.setAttribute("width",Math.max(1,x2-x));pat.setAttribute("height",Math.max(1,y2-y));
   let im=pat.querySelector("image");if(im){im.setAttribute("x",x);im.setAttribute("y",y);im.setAttribute("width",Math.max(1,x2-x));im.setAttribute("height",Math.max(1,y2-y));}
 }
}
const oldRender=render;render=function(){oldRender();drawRealFlagLayer()}
const oldFight=fight;fight=async function(){await oldFight();if(turn>0&&!busy)maybeRebel()}
function applyZoom(){let t=`translate(${zoom.x} ${zoom.y}) scale(${zoom.k})`;$("countries").setAttribute("transform",t);$("flagLayer").setAttribute("transform",t);let f=$("realFlagLayer");if(f)f.setAttribute("transform",t)}
function resetZoom(){zoom={x:0,y:0,k:1};applyZoom()}
let pts=new Map(),last=null,lastDist=0;const map=$("map");
map.style.touchAction="none";
map.addEventListener("wheel",e=>{e.preventDefault();zoom.k=Math.max(1,Math.min(8,zoom.k*(e.deltaY<0?1.15:.87)));applyZoom()},{passive:false});
map.addEventListener("pointerdown",e=>{pts.set(e.pointerId,[e.clientX,e.clientY]);last=[e.clientX,e.clientY];map.setPointerCapture(e.pointerId)});
map.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);let a=[...pts.values()];if(a.length===2){let d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(lastDist){zoom.k=Math.max(1,Math.min(8,zoom.k*d/lastDist));applyZoom()}lastDist=d}else if(a.length===1&&last){zoom.x+=e.clientX-last[0];zoom.y+=e.clientY-last[1];last=[e.clientX,e.clientY];applyZoom()}});
function pend(e){pts.delete(e.pointerId);last=null;lastDist=0}map.addEventListener("pointerup",pend);map.addEventListener("pointercancel",pend);map.addEventListener("dblclick",resetZoom);

document.querySelectorAll(".country").forEach(e=>e.onclick=v=>{v.stopPropagation();sel=e.dataset.id;render()});$("map").onclick=()=>{sel=null;render()};$("play").onclick=toggle;$("step").onclick=()=>{if(run)toggle();fight()};$("reset").onclick=reset;$("again").onclick=()=>{reset();toggle()};document.querySelectorAll(".speed").forEach(b=>b.onclick=()=>{speed=+b.dataset.speed;document.querySelectorAll(".speed").forEach(x=>x.classList.remove("active"));b.classList.add("active")});reset();
